<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <rect width="1080" height="1080" fill="#120B2B"/>
  <rect x="60" y="60" width="960" height="960" rx="36" fill="#1B1140" stroke="#4338CA" stroke-width="4"/>

  <text x="100" y="150" font-family="Arial" font-size="42" font-weight="700" fill="#DDD6FE">Top Driver Story</text>
  <text x="100" y="195" font-family="Arial" font-size="26" fill="#C4B5FD">Real weekly effort from Mumbai zone</text>

  <rect x="100" y="240" width="880" height="320" rx="22" fill="#312E81"/>
  <text x="130" y="320" font-family="Arial" font-size="34" font-weight="700" fill="#FFFFFF">Driver: &lt;DRIVER_NAME_OR_ALIAS&gt;</text>
  <text x="130" y="380" font-family="Arial" font-size="30" fill="#EDE9FE">Zone: &lt;ZONE&gt;</text>
  <text x="130" y="440" font-family="Arial" font-size="30" fill="#EDE9FE">Trips completed: &lt;TRIP_COUNT&gt;</text>
