  <rect x="100" y="600" width="420" height="220" rx="20" fill="#1D4ED8"/>
  <text x="130" y="670" font-family="Arial" font-size="32" font-weight="700" fill="#FFFFFF">What worked</text>
  <text x="130" y="725" font-family="Arial" font-size="27" fill="#DBEAFE">- Peak time focus</text>
  <text x="130" y="770" font-family="Arial" font-size="27" fill="#DBEAFE">- Zone switching discipline</text>

  <rect x="560" y="600" width="420" height="220" rx="20" fill="#0F766E"/>
  <text x="590" y="670" font-family="Arial" font-size="32" font-weight="700" fill="#FFFFFF">Tip to others</text>
  <text x="590" y="725" font-family="Arial" font-size="27" fill="#CCFBF1">&lt;DRIVER_TIP_LINE_1&gt;</text>
  <text x="590" y="770" font-family="Arial" font-size="27" fill="#CCFBF1">&lt;DRIVER_TIP_LINE_2&gt;</text>

  <text x="100" y="900" font-family="Arial" font-size="28" fill="#DDD6FE">Want to be featured? Maintain consistency this week.</text>
  <text x="100" y="950" font-family="Arial" font-size="22" fill="#A5B4FC">Official update by OLA Auto Mumbai driver community team.</text>
