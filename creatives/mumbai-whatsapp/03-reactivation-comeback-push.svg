  <text x="130" y="370" font-family="Arial" font-size="30" fill="#DCFCE7">&lt;TIME_WINDOW&gt; in &lt;ZONE&gt;</text>
  <text x="130" y="420" font-family="Arial" font-size="28" fill="#DCFCE7">Focus short trips and stay online in peak pockets.</text>

